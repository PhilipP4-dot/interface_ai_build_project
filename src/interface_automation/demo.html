<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Sample Credit Union — Training</title>
<style>
body{font:16px Georgia,serif;background:#edf1f2;color:#183238;margin:0}
header{background:#173f48;color:white;padding:24px 8%}main{margin:36px auto;max-width:760px;background:white;padding:32px;border:1px solid #bbc9cc}
table{border-collapse:collapse;width:100%;margin:24px 0}td,th{border:1px solid #bbc9cc;padding:14px;text-align:left}
button,input{font:inherit;padding:10px}button{background:#173f48;color:white;border:0;cursor:pointer}a{color:#135f77}small{display:block;margin-top:20px;color:#52686e}
.checkpoint{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
<header><h1>Sample Credit Union</h1>Staff workstation · synthetic training data only</header>
<main><h2>Member search</h2><form><label>Member ID <input name="member" maxlength="5" autocomplete="off"></label> <button>Search</button></form>
<div id="content"></div><small>Demo members: 12345 and 67890. Any other five-digit ID returns not found.</small></main>
<script>
const params=new URLSearchParams(location.search);
const scenario=params.get('scenario')||'normal';
const content=document.querySelector('#content');
const members={'12345':['Alex Example','1250.75'],'67890':['Sam Sample','842.10']};
const balancePattern=/^(?:0|[1-9][0-9]{0,8})(?:\.[0-9]{1,2})?$/;
try{const saved=JSON.parse(sessionStorage.getItem('demoBalances')||'{}');for(const id of Object.keys(members)){if(typeof saved[id]==='string'&&balancePattern.test(saved[id]))members[id][1]=saved[id]}}catch{}
function showAccounts(id){
 content.innerHTML='<h2>Account details</h2><table><tr><th>Account</th><th>Balance (USD)</th></tr><tr><td>Savings</td><td role="status" aria-label="Savings balance"></td></tr></table><p class="checkpoint">Account details loaded</p><form id="balanceForm" novalidate><h3>Change savings balance</h3><label for="newBalance">New savings balance (USD)</label> <input id="newBalance" name="balance" inputmode="decimal" autocomplete="off" required> <button type="submit">Update savings balance</button><p role="status" aria-label="Balance update" id="balanceMessage"></p><small>Changes are synthetic and stay in this browser tab, including after refresh.</small></form>';
 content.querySelector('[aria-label="Savings balance"]').textContent=members[id][1];
 const form=content.querySelector('#balanceForm');
 form.onsubmit=event=>{
  event.preventDefault();const feedback=content.querySelector('#balanceMessage');
  if(document.querySelector('input[name="member"]').value!==id){feedback.textContent='Search for the current member before updating a balance.';return}
  const value=form.elements.balance.value.trim();
  if(!balancePattern.test(value)){feedback.textContent='Enter a balance from 0 to 999999999.99 with at most two decimal places.';return}
  const parts=value.split('.');const formatted=parts[0]+'.'+(parts[1]||'').padEnd(2,'0');
  const saved=Object.fromEntries(Object.entries(members).map(([key,member])=>[key,key===id?formatted:member[1]]));
  try{sessionStorage.setItem('demoBalances',JSON.stringify(saved))}catch{feedback.textContent='Browser storage is unavailable. The balance was not changed.';return}
  members[id][1]=formatted;
  content.querySelector('[aria-label="Savings balance"]').textContent=formatted;
  feedback.textContent='Savings balance updated.';
 };
}
function message(text){delete content.dataset.member;content.replaceChildren();const p=document.createElement('p');p.role='status';p.textContent=text;content.append(p)}
document.querySelector('form').addEventListener('submit',event=>{
 event.preventDefault(); const id=document.querySelector('input').value;
 if(!/^[0-9]{5}$/.test(id)){message('Enter a five-digit member ID');return}
 if(scenario==='permission_denied'){message('Permission denied');return}
 if(scenario==='session_expired'&&!window.sessionRestored){message('Session expired');const b=document.createElement('button');b.textContent='Restore session';b.onclick=()=>{window.sessionRestored=true;document.querySelector('form').requestSubmit()};content.append(b);return}
 message('Searching');
 const showResults=()=>{
 content.dataset.member=id;
 if(!members[id]){message('Member not found');return}
 content.innerHTML='<table><tr><th>Member</th><th>Record</th></tr><tr><td></td><td><a href="#details">View accounts</a></td></tr></table>';
 content.querySelector('td').textContent=members[id][0];
 content.querySelector('a').onclick=event=>{event.preventDefault();showAccounts(id)};
 };
 if(scenario==='manual_review'){
   message('Operator review required');const button=document.createElement('button');
   button.textContent='Continue review';button.onclick=showResults;content.append(button);return;
 }
 setTimeout(showResults,scenario==='slow'?1200:50);
});
</script></html>
