[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interface-automation"
version = "0.1.0"
description = "Local computer-use automation prototype"
requires-python = ">=3.12"
dependencies = ["playwright==1.62.0", "pydantic==2.13.5"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.7", "mypy==2.3.1"]

[project.scripts]
interface-automation = "interface_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interface_automation = ["demo.html", "dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
